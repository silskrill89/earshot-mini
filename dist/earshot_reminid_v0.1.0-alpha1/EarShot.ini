; EarShot - miniaudio edition (earshot_reminid) - default configuration
; v0.1.0-alpha1
;
; Every key below ships with the same default the original EarShot /
; EarShotOpenAL used, so an old EarShot.ini can be dropped in unchanged.
; Missing keys fall back to these defaults.
;
; Distances are in meters. rolloffFactor: higher = faster falloff.
; airAbsorption: OpenAL-style factor (1.0 = none, higher = more high
; frequency loss with distance).

[MAIN]
Logging = false
Max bytes in log = 9000000
Distant gunshot distance = 50.0
Distant explosion distance = 100.0
Ambience interval min = 5000
Ambience interval max = 10000
Zone ambience interval min = 5000
Zone ambience interval max = 10000
Stereo ambience volume = 0.3

; --- alpha1 hotkeys (hex virtual-key codes, 0 = disabled) ---
keyVerbose = 0x76
keyReloadAudio = 0x78

; --- alpha1 realism effects ---
; Occlusion: muffle sounds whose path from source to listener is blocked
; by world geometry (walls, buildings). cutoff = low-pass Hz when fully
; blocked (50..20000).
Occlusion = 1
Occlusion cutoff = 700
; Incidence: color the sound by angle - brighter when the source faces
; you, duller behind it. cutoff = low-pass Hz at 90 degrees off-axis.
Incidence = 1
Incidence cutoff = 1200

[EXPLOSIONS]
explosion.main.maxDist = 100.0
explosion.main.refDist = 10.0
explosion.main.rolloffFactor = 0.7
explosion.main.airAbsorption = 0.6
explosion.distant.maxDist = 4000.0
explosion.distant.refDist = 10.0
explosion.distant.rolloffFactor = 0.5
explosion.distant.airAbsorption = 1.0
explosion.debris.maxDist = 150.0
explosion.debris.refDist = 1.0
explosion.debris.rolloffFactor = 1.5
explosion.debris.airAbsorption = 1.0
explosion.underwater.maxDist = 4000.0
explosion.underwater.refDist = 15.0
explosion.underwater.rolloffFactor = 0.2
explosion.underwater.airAbsorption = 3.0

; Per-explosion-type overrides. Add a section only for the type you want to
; retune; types without their own section use [EXPLOSIONS] above.
; Type ids: 0 grenade, 1 molotov, 2 rocket, 3 weakrocket, 4 car, 5 car_quick,
; 6 boat, 7 aircraft, 8 mine, 9 object, 10 tank cannon, 11 fireball
; (same keys as [EXPLOSIONS]: explosion.main.*, explosion.distant.*,
;  explosion.debris.*, explosion.underwater.*)
;[EXPLOSION_TYPE_0]
;explosion.main.maxDist = 100.0

[RICOCHET]
; Used for every surface that has no RICOCHET_SURFACE_TYPE_<n> section.
maxDist = 50.0
refDist = 3.5
rolloffFactor = 5.0
airAbsorption = 3.0

; Per-surface overrides, e.g.:
;[RICOCHET_SURFACE_TYPE_45]
;maxDist = 50.0
;refDist = 3.5
;rolloffFactor = 5.0
;airAbsorption = 3.0
;pitch = 1.0

[GUNSHELLS]
general_gunshell.maxDist = 1e30
general_gunshell.refDist = 1.0
general_gunshell.rolloffFactor = 1.5
general_gunshell.airAbsorption = 4.0
shotgun_shell.maxDist = 1e30
shotgun_shell.refDist = 1.0
shotgun_shell.rolloffFactor = 1.5
shotgun_shell.airAbsorption = 3.0
;gunshells.pitch = 1.0
;shotgunshells.pitch = 1.0

[TANKCANNON]
maxDist = 125.0
refDist = 3.5
rolloffFactor = 0.3
airAbsorption = 0.3
;tankcannon.pitch = 1.0
